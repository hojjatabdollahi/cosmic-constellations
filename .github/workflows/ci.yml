name: CI

on:
  pull_request:

jobs:
  build-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install --yes just
          just build-changed
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          path: |
            log
            out
